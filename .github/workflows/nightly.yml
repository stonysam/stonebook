name: Nightly check-in and backup

# Keeps the free Supabase project from pausing (it pauses after a week without activity)
# and keeps an encrypted copy of the family's data for 30 days. Restore steps:
# docs/backup-and-restore.md

on:
  schedule:
    - cron: '17 1 * * *'  # 02:17 or 03:17 in Prague, depending on daylight saving
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://qiddytmxiftsvmwoisuc.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_GZ1mtZdWoe6cUOFsxz602w_50I4LLHB  # public by design
    steps:
      - name: Check in with Supabase
        run: |
          curl -fsS -o /dev/null "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_PUBLISHABLE_KEY"

      - name: Dump the family data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "::error::Add the SUPABASE_DB_URL secret (see docs/backup-and-restore.md)"; exit 1; }
          docker run --rm -e DB_URL postgres:17 \
            sh -c 'pg_dump "$DB_URL" --data-only --schema=public --no-owner' > stonebook.sql
          grep -q 'COPY public.members' stonebook.sql || { echo "::error::Dump looks empty"; exit 1; }

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$PASSPHRASE" || { echo "::error::Add the BACKUP_PASSPHRASE secret (see docs/backup-and-restore.md)"; exit 1; }
          name="stonebook-$(date -u +%F).sql.gpg"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$name" stonebook.sql
          shred -u stonebook.sql
          echo "BACKUP_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      # Photos live in Supabase Storage, not the database. The S3 key reads every file
      # (it bypasses the app's privacy rules), so it stays in GitHub secrets and is used only here.
      - name: Copy and encrypt the photos
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::Photos not backed up: add the SUPABASE_S3_ACCESS_KEY_ID and SUPABASE_S3_SECRET_ACCESS_KEY secrets (see docs/backup-and-restore.md)"
            exit 0
          fi
          aws configure set default.s3.addressing_style path
          mkdir photos
          aws s3 sync s3://photos photos --only-show-errors \
            --endpoint-url https://qiddytmxiftsvmwoisuc.storage.supabase.co/storage/v1/s3
          echo "Photos: $(find photos -type f | wc -l)"
          name="stonebook-photos-$BACKUP_DATE.tar.gpg"
          tar -cf - photos | gpg --batch --yes --pinentry-mode loopback --passphrase-file <(printf '%s' "$PASSPHRASE") \
            --symmetric --cipher-algo AES256 -o "$name"
          rm -rf photos

      - uses: actions/upload-artifact@v6
        with:
          name: stonebook-${{ env.BACKUP_DATE }}
          path: stonebook-*.gpg
          retention-days: 30
          if-no-files-found: error
